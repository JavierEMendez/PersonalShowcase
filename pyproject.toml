[project]
name = "showcase"
version = "0.1.0"
description = "MPC Underwriting and the Deal-to-Portfolio Copilot, hosted as one FastAPI app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "pypdf>=6",
  "fpdf2>=2.8",
  "anthropic>=1.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "design", "docs", "private"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "core", "tests", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
